name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC Trusted Publishing — no NPM_TOKEN needed
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # OIDC Trusted Publishing needs npm CLI >=11.5.1; don't rely on whatever
      # version node-version:24 happens to bundle.
      - run: npm install -g npm@12.0.2

      # Trusted Publishing is configured on the package's npmjs.com settings
      # page (org rafaelgaspar, repo homebridge-philipstv-hue-2020, workflow
      # publish-to-npm.yaml) — npm CLI auto-detects the GitHub Actions OIDC
      # token, no auth step or secret needed.
      - run: npm publish --access public
